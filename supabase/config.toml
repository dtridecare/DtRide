[project]
name = "dt-ride"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[realtime]
enabled = true

[storage]
enabled = true

# send-push uses a shared secret (x-push-secret), not user JWTs —
# pg_net-style server callers and sibling functions invoke it directly.
[functions.send-push]
verify_jwt = false
