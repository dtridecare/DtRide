name: driver_app
description: DT Ride Driver app (iOS + Android, background GPS).
publish_to: none
version: 0.1.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  dt_core:
    path: ../../packages/dt_core
  supabase_flutter: ^2.8.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  firebase_messaging: ^15.1.5
  flutter_background_service: ^5.0.0
  razorpay_flutter: ^1.3.6
  image_picker: ^1.1.2
  url_launcher: ^6.3.3
  google_sign_in: ^6.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

# 1. Drop artwork in assets/branding/ (see README there), then run:
#      dart run flutter_native_splash:create
#      dart run flutter_launcher_icons
flutter_native_splash:
  color: "#071F52"
  background_image: assets/branding/splash.png
  android_12:
    color: "#071F52"
    image: assets/branding/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/logo.png
  adaptive_icon_background: "#071F52"
  adaptive_icon_foreground: assets/branding/logo.png
  remove_alpha_ios: true
